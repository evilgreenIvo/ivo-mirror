plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.evilgreen.airplay'
    compileSdk = 35
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'com.evilgreen.airplay'
        minSdk = 29
        targetSdk = 35
        versionCode = 8
        versionName = '0.7.0'
        // OpenSSL is built for 64-bit ARM (every phone the app is used on).
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.31.6'
        }
    }

    // The release key stays out of the repo (keystore/ is ignored). Without it, a release build comes out
    // unsigned, which is fine for anyone building from the source.
    def keyProps = new Properties()
    def keyFile = rootProject.file('keystore/keystore.properties')
    if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile = file(keyProps['storeFile'])
                storePassword = keyProps['storePassword']
                keyAlias = keyProps['keyAlias']
                keyPassword = keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (keyFile.exists()) signingConfig = signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig = true }
}

dependencies {
}
